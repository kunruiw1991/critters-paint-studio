<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b3b"><title>CHUYU · Star Rescue</title><style>
*{box-sizing:border-box}body{margin:0;background:#11152e;color:#fff6e6;font-family:ui-rounded,system-ui,sans-serif;overscroll-behavior:none}button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}button:focus-visible{outline:4px solid #fff}#app{max-width:660px;margin:auto;padding:12px 14px max(12px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:10px;margin-bottom:10px}.brand{flex:1;font-weight:900;letter-spacing:2px;font-size:13px;color:#f6d693}.sub{display:block;color:#949dca;letter-spacing:3px;font-size:9px;margin-top:4px}.round{background:#2a3054;border:1px solid #42486d;border-radius:16px;width:46px;height:46px;font-size:23px}#quest{display:flex;align-items:center;justify-content:space-between;background:#252b4c;border:1px solid #3a426a;border-radius:19px;padding:10px 16px;margin-bottom:10px;font-size:23px;min-height:62px}#progress{font-size:15px;color:#ffdf8b;letter-spacing:3px}.board{position:relative;overflow:hidden;border-radius:25px;border:2px solid #424d79;box-shadow:0 16px 60px #05091c}canvas{display:block;width:100%;aspect-ratio:9/10;touch-action:none;background:#202b4d}#powers{display:flex;gap:10px;margin-top:12px}#powers button{flex:1;min-height:66px;border-radius:19px;background:#2b345a;border:1px solid #53658c;display:flex;align-items:center;justify-content:center;gap:10px;font-size:27px}#powers span{font-size:11px;font-weight:800;letter-spacing:1px}#powers button:disabled{opacity:.45}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b102bcb;padding:20px;backdrop-filter:blur(6px)}#overlay.hidden{display:none}.card{width:100%;text-align:center}.card h1{font-size:28px;letter-spacing:2px;margin:12px 0 8px}.card p{color:#bdc8ef;font-size:13px}.hero{font-size:78px;filter:drop-shadow(0 10px 20px #9873fc55)}.sequence{font-size:32px;background:#293254;border:1px solid #535e86;border-radius:20px;padding:14px 5px;margin:23px 0}.play{background:#ffe59a;color:#282044;border-radius:24px;min-width:104px;min-height:68px;font-size:35px;box-shadow:0 5px 0 #bca767}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.level{height:65px;border-radius:17px;background:#333e64;font-size:24px}.level.done{background:#4a5374;border:2px solid #ffdc87}.tiny{font-size:11px;color:#8e9abe;text-align:center;margin:12px 0 0;letter-spacing:1px}#album{font-size:28px;letter-spacing:7px;margin:17px 0;min-height:40px}@media(min-height:850px){#app{padding-top:24px}}@media(max-height:720px) and (min-width:600px){#app{max-width:470px}canvas{aspect-ratio:9/9}#powers button{min-height:50px}}
</style><div id="app"><header><button class="round" id="home" aria-label="关卡地图">⌂</button><div class="brand">CHUYU<span class="sub">STAR RESCUE CLUB</span></div><button class="round" id="sound" aria-label="声音">♫</button></header><div id="quest"><span id="goal">🗝️ → 🫧 → 🏠</span><span id="progress"></span></div><div class="board"><canvas id="game" width="720" height="800" aria-label="点击钥匙、小动物或目的地移动"></canvas><div id="overlay"></div></div><div id="powers"><button id="mom" aria-label="妈妈护盾">🛡️ <span>KUNRUI</span></button><button id="dad" aria-label="爸爸清除小怪">⚡ <span>CRAIG</span></button><button id="hint" aria-label="指引下一步">💡</button></div><p class="tiny">✦ SMILING FRIENDS · LITTLE DEMON HUNTERS ✦</p></div>
<script>
'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),overlay=document.getElementById('overlay'),goal=document.getElementById('goal'),progress=document.getElementById('progress');
const W=9,H=10,S=80,colors=['#b58bff','#ffc36e','#fa9dca','#85e2bd','#87c9fc','#ffe488','#ff9b8b','#e8c4ff'],faces=['🐱','🐶','🐰','🐻','🐘','🐥','🦄','🐷'];
let saved={done:[]};try{let a=JSON.parse(localStorage.getItem('chuyu-star-rescue-v1'));if(a&&Array.isArray(a.done))saved.done=a.done.filter(n=>Number.isInteger(n)&&n>=0&&n<8)}catch(e){}
let level=0,tiles=[],friends=[],keys=[],stars=[],enemies=[],portals=[],player={x:1,y:8},trail=[],route=[],particles=[],inventory=[],active=false,won=false,clock=0,last=0,shield=0,momCD=0,dadCD=0,muted=false,audio,home={x:1,y:8},target=null,flash=0,stepTimer=0;
const layouts=[[],[[4,2],[4,3],[4,4],[4,6]],[[2,4],[3,4],[4,4],[6,4],[7,4]],[[3,2],[3,3],[3,4],[5,5],[5,6],[5,7]],[[2,3],[3,3],[5,3],[6,3],[4,5],[4,6]],[[2,2],[2,3],[2,5],[2,6],[6,3],[6,4],[6,6]],[[3,2],[4,2],[5,2],[3,6],[4,6],[5,6]],[[2,3],[3,3],[5,3],[6,3],[2,6],[3,6],[5,6],[6,6]]];
function tone(f=660){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch(e){}}
function save(){try{localStorage.setItem('chuyu-star-rescue-v1',JSON.stringify(saved))}catch(e){}}
function isWall(x,y){return x<1||y<1||x>7||y>8||tiles.some(p=>p[0]===x&&p[1]===y)}
function pathTo(tx,ty,from=player){let sx=Math.round(from.x),sy=Math.round(from.y),q=[[sx,sy,[]]],seen=new Set([sx+','+sy]);while(q.length){let[x,y,p]=q.shift();if(x===tx&&y===ty)return p;for(let[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(!isWall(nx,ny)&&!seen.has(k)){seen.add(k);q.push([nx,ny,p.concat([{x:nx,y:ny}])])}}}return null}
function burst(x,y,c){for(let i=0;i<16;i++)particles.push({x:x*S+40,y:y*S+40,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:1,c})}
function start(n){level=n;tiles=layouts[n];player={x:1,y:8};home={x:1,y:8};route=[];trail=[];particles=[];inventory=[];won=false;active=true;shield=0;momCD=0;dadCD=0;target=null;clock=0;stepTimer=0;flash=0;
let spots=[[7,1],[1,1],[7,7]],ks=[[3,7],[1,3],[6,8]],count=n<2?2:3;
friends=spots.slice(0,count).map((p,i)=>({x:p[0],y:p[1],id:(n+i)%8,key:i,rescued:false}));keys=ks.slice(0,count).map((p,i)=>({x:p[0],y:p[1],id:i,taken:false}));stars=[[4,1],[7,5],[3,5]].filter(p=>!isWall(...p)).map(p=>({x:p[0],y:p[1],taken:false}));
enemies=n===0?[]:[{x:5,y:4,baseX:5,baseY:4,phase:0,stun:0}];if(n>4)enemies.push({x:4,y:7,baseX:4,baseY:7,phase:2,stun:0});portals=n>=3?[{x:1,y:5},{x:7,y:3}]:[];overlay.classList.add('hidden');updateHUD()}
function updateHUD(){let rescued=friends.filter(f=>f.rescued).length;goal.innerHTML=rescued===friends.length?'🏠 ← '+friends.map(f=>faces[f.id]).join(''):'🗝️ → 🫧 '+friends.map(f=>f.rescued?'💖':faces[f.id]).join('');progress.textContent=(level+1)+' / 8';document.getElementById('mom').disabled=!active||momCD>0;document.getElementById('dad').disabled=!active||dadCD>0}
function collect(){for(let k of keys)if(!k.taken&&player.x===k.x&&player.y===k.y){k.taken=true;inventory.push(k.id);burst(k.x,k.y,colors[k.id]);tone(780)}for(let f of friends)if(!f.rescued&&player.x===f.x&&player.y===f.y){if(inventory.includes(f.key)){f.rescued=true;burst(f.x,f.y,colors[f.id]);tone(1000)}else{target=keys.find(k=>k.id===f.key);flash=2;tone(260)}}for(let s of stars)if(!s.taken&&s.x===player.x&&s.y===player.y){s.taken=true;burst(s.x,s.y,'#ffe488');tone(1200)}if(friends.every(f=>f.rescued)&&player.x===home.x&&player.y===home.y)win();updateHUD()}
function win(){if(won)return;won=true;active=false;if(!saved.done.includes(level))saved.done.push(level);save();tone(1320);overlay.classList.remove('hidden');overlay.innerHTML='<div class="card"><div class="hero">🏡</div><h1>CHUYU ✨</h1><div id="album">'+friends.map(f=>faces[f.id]).join('')+'</div><div class="sequence">'+stars.map(s=>s.taken?'⭐':'☆').join(' ')+'</div><button class="play" id="next" aria-label="下一关">'+(level===7?'🏆':'▶')+'</button></div>';document.getElementById('next').onclick=()=>level===7?map():start(level+1)}
function map(){active=false;route=[];overlay.classList.remove('hidden');overlay.innerHTML='<div class="card"><div class="hero">🐱🌙</div><h1>STAR RESCUE</h1><div class="sequence">🗝️ → 🫧 → 🏠</div><div class="levels">'+faces.map((f,i)=>'<button class="level '+(saved.done.includes(i)?'done':'')+'" data-level="'+i+'" aria-label="第'+(i+1)+'关">'+f+(saved.done.includes(i)?' ✦':'')+'</button>').join('')+'</div><p>👆 🗝️　👆 🫧　👆 🏠</p></div>';overlay.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));updateHUD()}
function choose(x,y){if(!active)return;tone(430);let tx=Math.max(1,Math.min(7,Math.floor(x/S))),ty=Math.max(1,Math.min(8,Math.floor(y/S)));let p=pathTo(tx,ty);if(p!==null){route=p;target={x:tx,y:ty};flash=1;collect()}else{burst(tx,ty,'#aebadd')}}
cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect();choose((e.clientX-r.left)*720/r.width,(e.clientY-r.top)*800/r.height)});
document.getElementById('home').onclick=map;document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇':'♫';tone()};
document.getElementById('mom').onclick=()=>{if(!active||momCD>0)return;shield=12;momCD=16;tone(900);burst(player.x,player.y,'#8bf5ed');updateHUD()};document.getElementById('dad').onclick=()=>{if(!active||dadCD>0)return;enemies.forEach(e=>{e.stun=12;burst(e.x,e.y,'#ffe488')});dadCD=15;tone(180);updateHUD()};
function nextGoal(){return keys.find(k=>!k.taken)||friends.find(f=>!f.rescued)||home}
document.getElementById('hint').onclick=()=>{if(!active)return;target=nextGoal();flash=6;route=pathTo(target.x,target.y)||[];tone(600)};
window.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&active){e.preventDefault();let x=player.x+d[0],y=player.y+d[1];if(!isWall(x,y))route=[{x,y}]}});
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}
function line(x1,y1,x2,y2,c,w=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.stroke()}
function text(s,x,y,size=28,c='#fff'){ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=c;ctx.fillText(s,x,y)}
function critter(x,y,id,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);let c=colors[id%8];circle(0,5,25,c);if(id%3===0){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-24,-4);ctx.lineTo(-23,-30);ctx.lineTo(-4,-15);ctx.lineTo(15,-16);ctx.lineTo(25,-30);ctx.lineTo(25,3);ctx.fill()}else{circle(-19,-16,12,c);circle(19,-16,12,c)}circle(-8,0,4,'#25223e');circle(8,0,4,'#25223e');circle(-7,-1,1.4,'#fff');circle(9,-1,1.4,'#fff');ctx.beginPath();ctx.arc(0,7,10,0,Math.PI);ctx.fillStyle='#352743';ctx.fill();circle(-18,9,4,'#fff5');circle(18,9,4,'#fff5');text(id===0?'☾':'✦',0,25,13,'#fff1a1');ctx.restore()}
function draw(){ctx.clearRect(0,0,720,800);let bg=ctx.createLinearGradient(0,0,720,800);bg.addColorStop(0,['#24364c','#343052','#27444b','#343058'][level%4]);bg.addColorStop(1,'#18253b');ctx.fillStyle=bg;ctx.fillRect(0,0,720,800);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!isWall(x,y)){ctx.fillStyle=(x+y)%2?'#ffffff06':'#ffffff0c';ctx.beginPath();ctx.roundRect(x*S+3,y*S+3,74,74,18);ctx.fill()}else if(x>0&&x<8&&y>0&&y<9){circle(x*S+40,y*S+45,30,'#101c34');circle(x*S+40,y*S+31,27,'#436765');circle(x*S+32,y*S+24,15,'#568079');text('✧',x*S+46,y*S+25,18,'#93b8a0')}else{let t=(x*7+y*13)%5;text(t===0?'✦':t===1?'·':'✧',x*S+40,y*S+40,t===0?17:12,'#91a7c144')}}
text('🏡',home.x*S+40,home.y*S+40,53);if(friends.every(f=>f.rescued)&&active){circle(home.x*S+40,home.y*S+40,36+Math.sin(clock*4)*4,'#ffea9930');text('⬇',home.x*S+40,home.y*S-1,30,'#ffe59a')}
portals.forEach((p,i)=>{circle(p.x*S+40,p.y*S+40,27+Math.sin(clock*3)*3,'#7b72d844');text('🌀',p.x*S+40,p.y*S+40,36);text(i?'B':'A',p.x*S+40,p.y*S+69,12,'#b9afff')});
if(route.length){ctx.setLineDash([3,13]);ctx.beginPath();ctx.moveTo(player.x*S+40,player.y*S+40);route.forEach(p=>ctx.lineTo(p.x*S+40,p.y*S+40));ctx.strokeStyle='#fff0a078';ctx.lineWidth=5;ctx.stroke();ctx.setLineDash([])}
for(let s of stars)if(!s.taken)text('✦',s.x*S+40,s.y*S+40+Math.sin(clock*3+s.x)*4,31,'#ffdf88');
for(let k of keys)if(!k.taken){let x=k.x*S+40,y=k.y*S+40+Math.sin(clock*3)*4;circle(x,y,28,colors[k.id]+'25');circle(x-6,y-6,11,colors[k.id]);circle(x-6,y-6,5,'#25394e');line(x+1,y+1,x+16,y+17,colors[k.id],7);line(x+10,y+11,x+17,y+4,colors[k.id],6);text(['●','▲','♥'][k.id],x,y+30,13,colors[k.id])}
for(let f of friends)if(!f.rescued){let x=f.x*S+40,y=f.y*S+40;critter(x,y+Math.sin(clock*2)*3,f.id,.83);circle(x,y,35,'#9cdcf523');ctx.strokeStyle=colors[f.key];ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,35,0,Math.PI*2);ctx.stroke();text(inventory.includes(f.key)?'🔓':['●','▲','♥'][f.key],x+23,y+24,21,colors[f.key]);circle(x-13,y-20,5,'#ffffff88')}
for(let e of enemies){let x=e.x*S+40,y=e.y*S+40;circle(x,y+5,25,e.stun?'#57738b':'#694776');text(e.stun?'💤':'👾',x,y,35)}
let rescued=friends.filter(f=>f.rescued);rescued.forEach((f,i)=>{let p=trail[Math.max(0,trail.length-2-i)]||home;critter(p.x*S+40+(i%2?12:-12),p.y*S+42,f.id,.6)});
let px=player.x*S+40,py=player.y*S+40;circle(px,py+23,23,'#0004');if(shield>0){circle(px,py,38,'#85f5ee28');ctx.strokeStyle='#95f9f3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,38,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#ab85f8';ctx.beginPath();ctx.moveTo(px-15,py+5);ctx.lineTo(px-27,py+30);ctx.lineTo(px+24,py+30);ctx.lineTo(px+14,py+3);ctx.fill();circle(px,py-1,20,'#ffdab7');ctx.fillStyle='#513f70';ctx.beginPath();ctx.arc(px,py-9,22,Math.PI,Math.PI*2);ctx.fill();circle(px+21,py-8,8,'#8d6dda');circle(px+27,py+5,7,'#8d6dda');circle(px+29,py+17,6,'#8d6dda');circle(px-7,py,2.5,'#30273e');circle(px+7,py,2.5,'#30273e');text('⌣',px,py+8,16,'#88515b');text('✦',px,py-27,20,'#ffe690');text('CHUYU',px,py+40,11,'#fff0cd');
if(active&&target&&flash>0){let x=target.x*S+40,y=target.y*S+40;ctx.strokeStyle='#ffeaa4';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,34+Math.sin(clock*6)*6,0,Math.PI*2);ctx.stroke();text('👇',x,y-48,30)}
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life);text('✦',p.x,p.y,18,p.c)}ctx.globalAlpha=1;
if(inventory.length)inventory.forEach((k,i)=>text(['●','▲','♥'][k],270+i*50,37,24,colors[k]));}
function tick(dt){clock+=dt;particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt});if(!active)return;shield=Math.max(0,shield-dt);momCD=Math.max(0,momCD-dt);dadCD=Math.max(0,dadCD-dt);flash=Math.max(0,flash-dt);stepTimer+=dt;
if(route.length&&stepTimer>.19){stepTimer=0;trail.push({...player});if(trail.length>12)trail.shift();player=route.shift();collect();if(active&&route.length===0){let p=portals.find(p=>p.x===player.x&&p.y===player.y);if(p){let other=portals.find(q=>q!==p);player={...other};burst(player.x,player.y,'#c3b5ff');tone(750);collect()}}}
for(let e of enemies){e.stun=Math.max(0,e.stun-dt);if(!e.stun){e.phase+=dt*.65;let nx=e.baseX+Math.sin(e.phase)*.65;if(!isWall(Math.round(nx),Math.round(e.baseY)))e.x=nx;if(Math.hypot(e.x-player.x,e.y-player.y)<.55&&shield<=0){shield=4;e.stun=3;burst(player.x,player.y,'#ffb6e7');tone(240)}}}updateHUD()}
function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;tick(dt);draw();requestAnimationFrame(frame)}
start(0);map();requestAnimationFrame(frame);
</script></html>
