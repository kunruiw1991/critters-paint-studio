<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9e6d3"><title>CHUYU · Smiling Critters</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#c1e7d7;font-family:ui-rounded,system-ui,sans-serif;color:#383157;overflow:hidden;overscroll-behavior:none}button{font:inherit;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:5px solid #714fa2;outline-offset:4px}#app{position:relative;max-width:640px;height:100svh;max-height:1000px;margin:auto;overflow:hidden;background:linear-gradient(#ccecf9,#ebf8ea 66%,#b2dc95 66%);isolation:isolate;transition:background 1s}#app[data-scene="1"]{background:linear-gradient(#302f66,#817ca7 66%,#66678e 66%)}#app[data-scene="2"]{background:linear-gradient(#ffe0c8,#fff2d9 66%,#bfdaa1 66%)}header{height:44px;padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:4}.name{font-size:12px;letter-spacing:3px;font-weight:900;color:#3a416d}.dots{display:flex;gap:8px}.dot{width:8px;height:8px;border-radius:100%;background:#53577f30}.dot.on{background:#8162bb;box-shadow:0 0 0 3px #fff8}#mission{height:135px;position:relative;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}.target-card{width:150px;height:117px;background:#fffdf4;border:4px solid white;border-radius:30px;box-shadow:0 7px 0 #729baa26,0 8px 24px #45607717;position:relative;display:flex;align-items:center;justify-content:center}.target-card:after{content:'';position:absolute;bottom:-16px;left:60px;width:22px;height:22px;background:#fffdf4;transform:rotate(45deg);border-radius:4px}.target-card img{height:96px;max-width:126px;object-fit:contain;position:relative;z-index:1}#board{position:absolute;top:190px;bottom:165px;left:15px;right:15px;z-index:3}#board .bubble{position:absolute;width:clamp(104px,26vw,155px);aspect-ratio:1;border:3px solid #ffffffd9;border-radius:50%;padding:14px;background:radial-gradient(circle at 35% 26%,#fff9,#fff3 55%,#a4caef55 75%,#fff9);box-shadow:inset 0 0 18px #fff8,0 7px 13px #38587c20;transform:translate(-50%,-50%);transition:opacity .3s;animation:float 4s ease-in-out infinite;will-change:transform}#board .bubble:before{content:'';position:absolute;left:14%;top:12%;width:27%;height:12%;background:#fff9;border-radius:50%;transform:rotate(-35deg)}.bubble img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 #2b244314);pointer-events:none;user-select:none}.bubble.guided{border-color:#fff9b8;box-shadow:0 0 0 7px #fffac480,0 0 35px #ffe8a8,inset 0 0 16px #fff8}.bubble.guided:after{content:'';position:absolute;inset:-12px;border:3px solid #ffdd77;border-radius:100%;animation:ring 1.5s infinite}.bubble.pop{animation:pop .35s forwards!important;pointer-events:none}.bubble.wrong{animation:wobble .35s!important}#hand{position:absolute;width:62px;height:78px;z-index:8;pointer-events:none;filter:drop-shadow(0 3px 1px #39295540);animation:tap 1.25s ease-in-out infinite;display:none}#hand svg{width:100%;height:100%}.hill{position:absolute;bottom:60px;width:120%;height:220px;left:-30%;border-radius:50% 50% 0 0;background:#97c77e;z-index:0;transform:rotate(8deg)}.hill.two{left:25%;bottom:40px;background:#acd58c;transform:rotate(-10deg)}.cloud{position:absolute;background:#fff9;border-radius:70px;width:125px;height:32px;top:22%;left:-22px;z-index:0}.cloud:before,.cloud:after{content:'';position:absolute;background:inherit;border-radius:50%;width:60px;height:60px;bottom:0;left:20px}.cloud:after{width:45px;height:45px;left:65px}.cloud.two{left:auto;right:-30px;top:40%;transform:scale(.8)}#picnic{position:absolute;bottom:14px;left:10px;right:10px;height:135px;z-index:2;border-radius:42% 42% 20px 20px;background:repeating-linear-gradient(0deg,#fff2 0 14px,transparent 14px 28px),repeating-linear-gradient(90deg,#fff2 0 14px,transparent 14px 28px),#e9bca2;box-shadow:0 7px 0 #77996144;border:5px solid #f9e7d4;display:grid;grid-template-columns:repeat(8,1fr);align-items:end;padding:13px 8px}.friend{width:100%;height:90px;object-fit:contain;filter:grayscale(1);opacity:.17;transition:opacity .5s,filter .5s}.friend.saved{filter:none;opacity:1;animation:arrive .7s ease-out}.friend.dance{animation:dance .8s ease-in-out infinite alternate}#flying{position:absolute;z-index:12;pointer-events:none;width:125px;height:125px;object-fit:contain;display:none;filter:drop-shadow(0 8px 7px #0002)}#celebration{position:absolute;inset:0;background:#dcedebd9;backdrop-filter:blur(6px);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column}#celebration.show{display:flex}#party{display:grid;grid-template-columns:repeat(4,1fr);width:94%;gap:8px;margin-bottom:35px}#party img{width:100%;height:140px;object-fit:contain;animation:dance .8s ease-in-out infinite alternate}#again{height:86px;width:140px;border-radius:35px;border:5px solid white;background:#9871d7;box-shadow:0 7px 0 #7051a4;display:grid;place-items:center}#again svg{width:44px;height:44px;fill:white}#confetti{position:absolute;inset:0;pointer-events:none;z-index:22}.spark{position:absolute;width:9px;height:17px;border-radius:3px;animation:fall 1.3s ease-out forwards}.brand{position:absolute;bottom:2px;width:100%;font-size:8px;text-align:center;letter-spacing:2px;color:#786459;z-index:3}#app[data-scene="1"] .name{color:#f6eac8}#app[data-scene="1"] .hill{background:#667979}#app[data-scene="1"] .hill.two{background:#809892}
@keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(-6px) rotate(-3deg)}50%{transform:translate(-50%,-50%) translateY(6px) rotate(3deg)}}@keyframes ring{0%{transform:scale(.94);opacity:.8}100%{transform:scale(1.12);opacity:0}}@keyframes tap{0%,100%{transform:translate(0,0) rotate(-18deg)}50%{transform:translate(-8px,-12px) rotate(-18deg)}}@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.18);opacity:.8}100%{transform:translate(-50%,-50%) scale(.6);opacity:0}}@keyframes wobble{25%{transform:translate(-54%,-50%) rotate(-5deg)}75%{transform:translate(-46%,-50%) rotate(5deg)}}@keyframes arrive{0%{transform:scale(.4)}65%{transform:scale(1.25)}100%{transform:scale(1)}}@keyframes dance{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-14px) rotate(5deg)}}@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),190px) rotate(320deg);opacity:0}}
@media(max-height:690px){header{height:32px;padding-top:8px}#mission{height:109px}.target-card{height:92px;width:124px}.target-card img{height:76px}.target-card:after{left:48px}#board{top:152px;bottom:125px}#picnic{height:104px}.friend{height:66px}#board .bubble{width:clamp(98px,24vw,132px)}}@media(prefers-reduced-motion:reduce){#board .bubble,#hand,.friend.dance,#party img{animation:none}}

const names=['CatNap','DogDay','Bobby BearHug','Bubba Bubbaphant','CraftyCorn','Hoppy Hopscotch','KickinChicken','PickyPiggy'];
const ids=['catnap','dogday','bobby','bubba','crafty','hoppy','kickin','picky'];
const app=document.getElementById('app'),board=document.getElementById('board'),targetImg=document.getElementById('target'),hand=document.getElementById('hand'),picnic=document.getElementById('picnic'),flying=document.getElementById('flying'),celebration=document.getElementById('celebration');
let phase='loading',scene=0,step=0,order=[],rescued=[],correct=null,timers=[],hintTimer=null,audio=null,interacted=false,roundToken=0;
function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}function clearTimers(){timers.forEach(clearTimeout);timers=[];clearTimeout(hintTimer)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sound(win=false){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();[0,1,2].slice(0,win?3:1).forEach((v)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+v*.09;o.frequency.value=[660,830,1046][v];g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.23)})}catch(e){}}
function speak(){if(!interacted||!('speechSynthesis'in window))return;try{window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('找到 '+names[order[step]]+'，点一下。');u.lang='zh-CN';u.rate=.9;window.speechSynthesis.speak(u)}catch(e){}}
function imageFor(id){return ASSETS[ids[id]]}
function begin(){clearTimers();roundToken++;phase='playing';step=0;rescued=[];order=scene===0?[0,...shuffle([1,2,3,4,5,6,7])]:shuffle([0,1,2,3,4,5,6,7]);celebration.classList.remove('show');app.dataset.scene=scene;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===scene));picnic.innerHTML='';order.forEach(id=>{let im=document.createElement('img');im.src=imageFor(id);im.alt=names[id];im.className='friend';im.dataset.id=id;picnic.append(im)});showStep()}
function showStep(){if(step>=8){finish();return}phase='playing';board.innerHTML='';hand.style.display='none';let wanted=order[step];targetImg.src=imageFor(wanted);targetImg.alt=names[wanted];targetImg.style.opacity='1';
let count=scene===0?(step===0?1:3):scene===1?4:5;let choices=shuffle([wanted,...shuffle([0,1,2,3,4,5,6,7].filter(i=>i!==wanted)).slice(0,count-1)]);
let positions=count===1?[[50,48]]:count===3?[[27,27],[73,27],[50,76]]:count===4?[[27,25],[73,25],[27,76],[73,76]]:[[25,20],[75,20],[50,49],[25,80],[75,80]];
choices.forEach((id,i)=>{let b=document.createElement('button');b.className='bubble';b.type='button';b.dataset.id=id;b.setAttribute('aria-label','找到 '+names[id]);b.style.left=positions[i][0]+'%';b.style.top=positions[i][1]+'%';b.style.animationDelay=(-i*.65)+'s';let im=document.createElement('img');im.src=imageFor(id);im.alt=names[id];im.draggable=false;b.append(im);b.onclick=()=>choose(id,b);board.append(b);if(id===wanted)correct=b});
clearTimeout(hintTimer);hintTimer=later(hint,scene===0&&step<2?200:2500);speak()}
function hint(){if(phase!=='playing'||!correct)return;correct.classList.add('guided');positionHand();hand.style.display='block'}
function positionHand(){if(!correct)return;let r=correct.getBoundingClientRect(),a=app.getBoundingClientRect();hand.style.left=(r.left-a.left+r.width*.64)+'px';hand.style.top=(r.top-a.top+r.height*.63)+'px'}
function choose(id,b){if(phase!=='playing')return;interacted=true;if(id!==order[step]){b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');later(()=>b.classList.remove('wrong'),350);hint();return}phase='saving';clearTimeout(hintTimer);hand.style.display='none';correct.classList.remove('guided');board.querySelectorAll('button').forEach(el=>el.disabled=true);sound(true);b.classList.add('pop');rescued.push(id);let r=b.getBoundingClientRect(),a=app.getBoundingClientRect(),dest=picnic.querySelector('[data-id="'+id+'"]'),d=dest.getBoundingClientRect();flying.src=imageFor(id);flying.style.display='block';flying.style.width=r.width+'px';flying.style.height=r.height+'px';flying.style.left=(r.left-a.left)+'px';flying.style.top=(r.top-a.top)+'px';sprinkles(r.left-a.left+r.width/2,r.top-a.top+r.height/2);
let token=roundToken;let anim=flying.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+(d.left-r.left+(d.width-r.width)/2)+'px,'+(d.top-r.top+(d.height-r.height)/2)+'px) scale(.55)'}],{duration:700,easing:'cubic-bezier(.35,0,.35,1)',fill:'forwards'});anim.onfinish=()=>{if(token!==roundToken)return;flying.style.display='none';anim.cancel();dest.classList.add('saved');later(()=>{step++;showStep()},400)};}
function sprinkles(x,y){let box=document.getElementById('confetti');for(let i=0;i<20;i++){let p=document.createElement('i');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';p.style.background=['#9970d7','#ffe078','#89d2c5','#f3a8c0'][i%4];p.style.setProperty('--dx',(Math.random()*280-140)+'px');box.append(p);later(()=>p.remove(),1350)}}
function finish(){phase='finished';hand.style.display='none';board.innerHTML='';targetImg.style.opacity='0';document.querySelectorAll('.friend').forEach((el,i)=>{el.classList.add('dance');el.style.animationDelay=(-i*.1)+'s'});sound(true);later(()=>{document.getElementById('party').innerHTML=order.map((id,i)=>'<img src="'+imageFor(id)+'" alt="'+names[id]+'" style="animation-delay:'+(-i*.1)+'s">').join('');celebration.classList.add('show');sprinkles(app.clientWidth/2,app.clientHeight*.3)},1500)}
document.getElementById('again').onclick=()=>{scene=(scene+1)%3;begin()};window.addEventListener('resize',()=>{if(hand.style.display==='block')positionHand()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)window.speechSynthesis.cancel()});
Promise.all(ids.map(id=>new Promise((resolve,reject)=>{let im=new Image();im.onload=resolve;im.onerror=reject;im.src=ASSETS[id]}))).then(begin).catch(()=>{document.getElementById('mission').innerHTML='<button onclick="location.reload()" style="padding:20px;border-radius:20px">重新加载</button>'});
</script></body></html>
