<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171330"><title>CHUYU · Cloud Critter Studio</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;background:#171330;color:white;user-select:none;-webkit-user-select:none}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #fff;outline-offset:3px}button:active{transform:scale(.93)}.app{height:100%;min-height:400px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#54457e 0,#282042 58%,#17132d 100%);position:relative}.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;color:#efdca4;opacity:.55;animation:twinkle 4s infinite alternate}.top{z-index:2;height:96px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.family{display:flex;gap:12px}.person{background:#ffffff08;border:1px solid #ffffff18;border-radius:22px;padding:7px 17px 7px 8px;display:flex;gap:9px;align-items:center;font-size:12px;letter-spacing:1.8px;font-weight:800;color:#b9b0d2}.person svg{width:40px;height:40px}.person.active{color:#fff;border-color:#dfb5ff;background:#9f76d52a;box-shadow:0 0 25px #cd9cff22}.round{width:52px;height:52px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff0c;display:grid;place-items:center;font-size:24px}.utilities{display:flex;gap:10px}.main{display:flex;flex:1;min-height:0;z-index:1;padding:8px 28px 0;gap:24px}.tray{display:flex;flex-direction:column;gap:12px;justify-content:center;width:84px;flex-shrink:0}.shape{height:72px;width:76px;display:grid;place-items:center;border-radius:23px;background:#ffffff09;border:1px solid #ffffff16;transition:.2s}.shape svg{width:55px;height:55px}.shape.active{background:#b498e438;border-color:#d3b5ff;box-shadow:0 0 24px #bd8aff25}.stage{flex:1;min-width:0;position:relative;border-radius:40px;background:radial-gradient(ellipse at 50% 38%,#d6bef916,#a295cd03 65%);border:1px solid #ffffff0c;overflow:hidden}.stage:after{content:'';position:absolute;width:64%;height:9%;bottom:13%;left:18%;border-radius:50%;background:#c19ae71a;box-shadow:0 0 55px #c3a9ee20;pointer-events:none}canvas{display:block;width:100%;height:100%;touch-action:none;position:relative;z-index:1}.hint{position:absolute;left:50%;top:70%;transform:translateX(-50%);pointer-events:none;font-size:38px;z-index:2;animation:gesture 2.3s infinite;filter:drop-shadow(0 0 15px #fff8)}.hint.hide{display:none}.target{position:absolute;top:20px;left:22px;display:flex;align-items:center;gap:12px;z-index:2}.target .bubble{width:64px;height:64px;background:#fff9e9;border-radius:22px;display:grid;place-items:center;box-shadow:0 6px 20px #0002}.target svg{width:45px;height:45px}.target .dots{display:flex;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:#ffffff25}.dot.done{background:#ffdc8a;box-shadow:0 0 12px #ffce78}.right{width:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}.magic{height:94px;width:94px;background:linear-gradient(150deg,#ffe5a4,#ffd177);color:#6b3b55;border-radius:30px;box-shadow:0 7px 0 #a46a62,0 0 35px #ffc67a20;position:relative}.magic svg{width:58px;height:58px}.magic:after{content:'✦';position:absolute;right:0;top:-14px;font-size:27px;color:#fff1c2;animation:twinkle 1.4s infinite alternate}.album{display:flex;flex-direction:column;gap:10px;align-items:center;max-height:220px;overflow:hidden}.mini{width:66px;height:60px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff09;animation:pop .5s}.mini svg{width:48px;height:48px}.bottom{z-index:2;padding:20px 28px 26px;display:flex;align-items:center;justify-content:center;gap:32px}.palette,.tools{display:flex;gap:10px;align-items:center;background:#100d254d;padding:12px;border-radius:25px;border:1px solid #ffffff0d}.swatch{width:44px;height:44px;border-radius:50%;background:var(--c);border:4px solid #ffffff12;box-shadow:inset 0 0 0 1px #ffffff20}.swatch.active{outline:3px solid #fff;outline-offset:3px}.tool{width:48px;height:48px;background:transparent;border-radius:15px;font-size:27px}.tool.active{background:#ffffff20}.toast{position:absolute;inset:0;pointer-events:none;z-index:4;display:grid;place-items:center;font-size:95px;opacity:0}.toast.show{animation:celebrate 1.5s}.overlay{position:absolute;inset:0;background:#130c2ce8;backdrop-filter:blur(15px);z-index:10;padding:30px;display:none;overflow:auto}.overlay.open{display:block}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;margin-top:25px}.gallery .card{height:180px;background:#ffffff08;border:1px solid #ffffff18;border-radius:30px;display:grid;place-items:center;cursor:pointer}.card svg{width:135px;height:135px}.empty{font-size:80px;text-align:center;margin-top:80px}.galleryHead{display:flex;justify-content:space-between;align-items:center;font-size:40px}.footCloud{position:absolute;bottom:-65px;width:240px;height:130px;border-radius:50%;background:#8b71bc0d;pointer-events:none}@keyframes twinkle{to{opacity:.15;transform:scale(.75)}}@keyframes gesture{0%,100%{transform:translate(-65%,0) rotate(-12deg);opacity:.5}50%{transform:translate(0,-15px) rotate(12deg);opacity:1}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes celebrate{0%,100%{opacity:0;transform:scale(.5)}25%,70%{opacity:1;transform:scale(1)}}@media(max-width:700px){.top{padding:12px;height:82px}.person{padding:6px;gap:4px;font-size:9px;letter-spacing:.4px;flex-direction:column;border-radius:16px}.person svg{width:30px;height:30px}.family{gap:7px}.round{width:40px;height:40px;border-radius:14px}.utilities{gap:6px}.main{padding:0 8px;gap:7px}.tray{width:51px;gap:8px}.shape{width:49px;height:53px;border-radius:17px}.shape svg{width:39px;height:39px}.stage{border-radius:26px}.right{width:58px;gap:17px}.magic{width:56px;height:68px;border-radius:20px}.magic svg{width:40px}.mini{width:50px;height:45px}.mini svg{width:38px;height:38px}.target{top:12px;left:12px;gap:8px;flex-direction:column}.target .bubble{width:45px;height:45px;border-radius:15px}.target svg{width:34px;height:34px}.bottom{padding:16px 6px 20px;gap:9px}.palette,.tools{gap:6px;padding:8px;border-radius:20px}.swatch{width:30px;height:30px;border-width:2px}.tool{width:33px;height:36px;font-size:22px}}@media(max-height:620px) and (min-width:701px){.top{height:75px;padding:10px 28px}.tray{flex-direction:row;width:80px;flex-wrap:wrap;gap:6px}.shape{height:50px;width:65px}.shape svg{height:40px}.bottom{padding:12px}.album{max-height:130px}}
</style></head><body><div class="app"><div class="sky" id="sky"></div><header class="top"><div class="family" id="family"></div><div class="utilities"><button class="round" id="sound" aria-label="Toggle music">🔇</button><button class="round" id="galleryButton" aria-label="Saved cloud friends">🖼️</button></div></header><main class="main"><nav class="tray" id="shapes" aria-label="Cloud shapes"></nav><section class="stage"><div class="target"><div class="bubble" id="target"></div><div class="dots" id="dots"></div></div><canvas id="canvas" aria-label="Drag the cloud to stretch and shape it"></canvas><div class="hint" id="hint">👆</div></section><aside class="right"><button class="magic" id="magic" aria-label="Bring your cloud to life"><svg viewBox="0 0 64 64"><path d="M23 17 46 32 23 47Z" fill="currentColor"/><path d="m49 4 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="currentColor"/></svg></button><div class="album" id="album"></div><button class="round" id="reset" aria-label="Fresh cloud">↻</button></aside></main><footer class="bottom"><div class="palette" id="palette"></div><div class="tools" id="tools"><button class="tool active" data-tool="pull" aria-label="Stretch cloud">🤏</button><button class="tool" data-tool="squish" aria-label="Squish cloud">👐</button><button class="tool" data-tool="sparkle" aria-label="Add sparkle">✨</button></div></footer><div class="toast" id="toast">🌈✨</div><div class="overlay" id="overlay"><div class="galleryHead"><span>☁️💖</span><button class="round" id="close" aria-label="Close gallery">✕</button></div><div class="gallery" id="gallery"></div></div></div><script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');
const colors=['#f8efff','#c6a0ff','#ffabd7','#8ee8d0','#ffd68d','#92d6ff'];
const types=['cat','bunny','puppy','dragon','star','ice'];
const names=['CHUYU','KUNRUI','CRAIG'];
let shape='cat',color=colors[1],person=0,tool='pull',W=1,H=1,scale=1,time=0,drag=null,sparkles=[],visitors=[],progress=0,sound=false,audio=null,lastMusic=0;
let saved=[];try{saved=JSON.parse(localStorage.getItem('chuyu-clouds-v1')||'[]');if(!Array.isArray(saved))saved=[];saved=saved.filter(x=>types.includes(x.shape)&&colors.includes(x.color)&&Number.isInteger(x.person)).slice(-60)}catch(e){}
let points=[];
function icon(type,c='#c6a0ff',who=0){let ears='';if(type==='cat')ears='<path d="M20 31 16 7 37 22M63 22 84 7 79 33" fill="'+c+'" stroke="#6e528d" stroke-width="3" stroke-linejoin="round"/>';if(type==='bunny')ears='<ellipse cx="34" cy="22" rx="10" ry="21" fill="'+c+'"/><ellipse cx="66" cy="22" rx="10" ry="21" fill="'+c+'"/><path d="M34 8V29M66 8V29" stroke="#ffbedb" stroke-width="7" stroke-linecap="round"/>';if(type==='puppy')ears='<ellipse cx="19" cy="42" rx="12" ry="22" fill="#dda16e"/><ellipse cx="81" cy="42" rx="12" ry="22" fill="#dda16e"/>';if(type==='dragon')ears='<path d="m26 30-8-20 20 14M66 26l17-16-6 24" fill="#ffe59c"/><path d="M17 57 2 43 3 69 20 73M83 57l15-14-1 26-17 4" fill="'+c+'"/>';let body=type==='star'?'<path d="m50 10 12 25 28 4-20 21 5 29-25-13-25 13 5-29-20-21 28-4Z" fill="'+c+'"/>':type==='ice'?'<path d="m28 65 22 33 22-33" fill="#dfaf78"/><circle cx="50" cy="44" r="30" fill="'+c+'"/><circle cx="28" cy="57" r="14" fill="'+c+'"/><circle cx="72" cy="57" r="14" fill="'+c+'"/>':'<ellipse cx="50" cy="58" rx="35" ry="29" fill="'+c+'"/><circle cx="26" cy="45" r="18" fill="'+c+'"/><circle cx="50" cy="37" r="23" fill="'+c+'"/><circle cx="73" cy="46" r="18" fill="'+c+'"/>';return '<svg viewBox="0 0 100 100" aria-hidden="true">'+ears+body+'<ellipse cx="34" cy="56" rx="4" ry="6" fill="#352545"/><ellipse cx="66" cy="56" rx="4" ry="6" fill="#352545"/><circle cx="27" cy="65" r="6" fill="#ff82b0" opacity=".6"/><circle cx="73" cy="65" r="6" fill="#ff82b0" opacity=".6"/><path d="M39 65Q50 80 61 65" fill="#352545" stroke="#352545" stroke-width="2" stroke-linecap="round"/><path d="M42 67h16" stroke="#fff" stroke-width="3"/><path d="m50 82 3 5 6 1-5 4 1 6-5-3-5 3 1-6-5-4 6-1Z" fill="'+['#ffe199','#ff93d0','#90e5ff'][who]+'"/></svg>'}
function createUI(){names.forEach((n,i)=>{let b=document.createElement('button');b.className='person'+(!i?' active':'');b.innerHTML=icon(['bunny','cat','puppy'][i],['#c6a0ff','#ffabd7','#92d6ff'][i],i)+'<span>'+n+'</span>';b.setAttribute('aria-label',n);b.onclick=()=>{person=i;document.querySelectorAll('.person').forEach((e,j)=>e.classList.toggle('active',i===j));chime(440+i*110);burst(W/2,H/2,10)};$('family').append(b)});types.forEach(t=>{let b=document.createElement('button');b.className='shape'+(t===shape?' active':'');b.innerHTML=icon(t);b.setAttribute('aria-label',t);b.onclick=()=>{shape=t;reset();document.querySelectorAll('.shape').forEach((e,j)=>e.classList.toggle('active',types[j]===t));chime(530);updateTarget()};$('shapes').append(b)});colors.forEach(c=>{let b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.setProperty('--c',c);b.setAttribute('aria-label','Cloud color '+c);b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach((e,j)=>e.classList.toggle('active',colors[j]===c));chime(650);burst(W/2,H/2,8)};$('palette').append(b)});for(let i=0;i<42;i++){let s=document.createElement('span');s.className='star';s.textContent=i%4?'✦':'·';s.style.cssText=`left:${(i*37.3)%100}%;top:${(i*23.7)%100}%;font-size:${8+i%4*5}px;animation-delay:${i%6}s`;$('sky').append(s)}updateTarget();updateAlbum()}
function reset(){points=[[-80,10,49],[-46,-23,57],[5,-37,65],[57,-15,56],[86,18,44],[42,39,52],[-20,42,54]].map(p=>({x:p[0],y:p[1],r:p[2]}));sparkles=[];$('hint').classList.remove('hide');chime(330)}
function updateTarget(){const next=types[(types.indexOf(shape)+1)%types.length];$('target').innerHTML=icon(next,'#a49ab7');$('dots').innerHTML=[0,1,2].map(i=>'<span class="dot '+(i<progress?'done':'')+'"></span>').join('')}
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);scale=Math.min(W/390,H/345,1.65)}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,Math.max(rx,.1),Math.max(ry,.1),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function path(pts,fill){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawCloud(x,y,s,c,type,who,ps=points,alive=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(alive)ctx.rotate(Math.sin(time*2+x)*.12);let g=ctx.createLinearGradient(0,-100,0,95);g.addColorStop(0,'#fff7ff');g.addColorStop(.42,c);g.addColorStop(1,c);ctx.shadowColor=c+'77';ctx.shadowBlur=25;
if(type==='cat'){path([[-77,-16],[-79,-112],[-17,-52]],c);path([[25,-53],[81,-112],[86,-8]],c);path([[-65,-49],[-69,-91],[-35,-53]],'#fda9d7');path([[44,-54],[72,-91],[72,-48]],'#fda9d7')}
if(type==='bunny'){ellipse(-43,-98,22,70,c);ellipse(39,-104,22,75,c);ellipse(-43,-108,10,44,'#ffa9cf');ellipse(39,-114,10,46,'#ffa9cf')}
if(type==='puppy'){ellipse(-91,-9,27,60,'#dfad82');ellipse(91,-9,27,60,'#dfad82')}
if(type==='dragon'){path([[-87,5],[-151,-45],[-142,39],[-88,55]],c);path([[86,5],[148,-45],[139,39],[85,55]],c);path([[-66,-45],[-77,-101],[-30,-55]],'#ffdfa0');path([[27,-56],[75,-101],[63,-42]],'#ffdfa0')}
if(type==='ice'){path([[-62,38],[0,139],[65,38]],'#d8a166');ctx.strokeStyle='#efc38c';ctx.lineWidth=4;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-44+i*18,52);ctx.lineTo(18+i*8,109-i*13);ctx.stroke()}}
if(type==='star'){let pts=[];for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?59:116;pts.push([Math.cos(a)*r,Math.sin(a)*r])}path(pts,g)}else{ctx.beginPath();ps.forEach(p=>{ctx.moveTo(p.x+p.r,p.y);ctx.arc(p.x,p.y,p.r,0,Math.PI*2)});ctx.fillStyle=g;ctx.fill()}
ctx.shadowBlur=0;const blink=Math.sin(time*.7)> .992;ellipse(-36,7,7,blink?1.3:10,'#392744');ellipse(36,7,7,blink?1.3:10,'#392744');if(!blink){ellipse(-38,3,2.1,3,'white');ellipse(34,3,2.1,3,'white')}ellipse(-54,28,13,7,'#fc83ae88');ellipse(54,28,13,7,'#fc83ae88');ctx.beginPath();ctx.moveTo(-22,28);ctx.quadraticCurveTo(0,58,22,28);ctx.quadraticCurveTo(0,37,-22,28);ctx.fillStyle='#392744';ctx.fill();ctx.beginPath();ctx.moveTo(-14,31);ctx.quadraticCurveTo(0,35,14,31);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle=['#ffdf8f','#ff96d1','#96e8ff'][who];ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?7:15;let px=Math.cos(a)*r,py=70+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.restore()}
function burst(x,y,n=20){for(let i=0;i<n;i++)sparkles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:1,kind:i%3?'✦':'♡',c:colors[i%colors.length]})}
let previous=0;function frame(t){let dt=Math.min((t-previous)/1000,.04);previous=t;time=t/1000;ctx.clearRect(0,0,W,H);ctx.save();ctx.globalAlpha=.15;ctx.strokeStyle='#d6b0ff';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(W/2,H*.66,Math.min(W*.4,240),H*.18,-.12,0,Math.PI*2);ctx.stroke();ctx.restore();drawCloud(W/2,H*.46+Math.sin(time*1.7)*5,scale,color,shape,person);
visitors.forEach((v,i)=>{v.age+=dt;let x=W*(.13+.74*((Math.sin(v.age*.32+v.seed)+1)/2)),y=H*.84+Math.sin(v.age*2+i)*10;drawCloud(x,y,scale*.25,v.color,v.shape,v.person,v.points,true)});
sparkles=sparkles.filter(p=>p.life>0);sparkles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=20*dt;p.life-=dt*.7;ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;ctx.font='24px serif';ctx.fillText(p.kind,p.x,p.y)});ctx.globalAlpha=1;if(sound&&t-lastMusic>650){lastMusic=t;const melody=[0,4,7,12,7,4,2,7];chime(220*2**(melody[Math.floor(time*1.5)%8]/12),.07)}requestAnimationFrame(frame)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.onpointerdown=e=>{const p=pos(e);const x=(p.x-W/2)/scale,y=(p.y-H*.46)/scale;let best=points.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a);if(Math.hypot(x,y)>190){burst(p.x,p.y,7);return}canvas.setPointerCapture(e.pointerId);drag={point:best,start:p,ox:best.x,oy:best.y};$('hint').classList.add('hide');if(tool==='sparkle')burst(p.x,p.y,25);if(tool==='squish'){points.forEach(q=>{q.x*=.86;q.y*=.82;q.r=Math.min(q.r*1.04,80)});burst(p.x,p.y,8)}chime(380+Math.random()*120,.1)};
canvas.onpointermove=e=>{if(!drag)return;const p=pos(e);if(tool==='pull'){drag.point.x=Math.max(-125,Math.min(125,drag.ox+(p.x-drag.start.x)/scale));drag.point.y=Math.max(-82,Math.min(80,drag.oy+(p.y-drag.start.y)/scale))}else if(tool==='sparkle'&&Math.random()>.4)burst(p.x,p.y,2)};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(e=>e.classList.toggle('active',e===b));chime(600)});
function chime(freq,dur=.18){if(!sound||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.03)}
$('sound').onclick=()=>{sound=!sound;if(sound){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){sound=false}}$('sound').textContent=sound?'🎵':'🔇';$('sound').setAttribute('aria-pressed',String(sound))};
$('magic').onclick=()=>{let v={shape,color,person,points:points.map(p=>({...p})),seed:Math.random()*6,age:0};visitors.push(v);visitors=visitors.slice(-7);saved.push({shape,color,person,points:v.points});saved=saved.slice(-60);try{localStorage.setItem('chuyu-clouds-v1',JSON.stringify(saved))}catch(e){}progress=(progress+1)%4;updateTarget();updateAlbum();burst(W/2,H*.46,55);$('toast').classList.remove('show');void $('toast').offsetWidth;$('toast').classList.add('show');[520,650,780].forEach((n,i)=>setTimeout(()=>chime(n,.25),i*120));$('hint').classList.add('hide')};
function updateAlbum(){$('album').innerHTML=saved.slice(-3).reverse().map(v=>'<button class="mini" aria-label="Saved '+v.shape+'">'+icon(v.shape,v.color,v.person)+'</button>').join('');$('album').querySelectorAll('button').forEach(b=>b.onclick=openGallery)}
function openGallery(){$('gallery').innerHTML=saved.length?saved.slice().reverse().map(v=>'<button class="card" aria-label="Play with saved '+v.shape+'">'+icon(v.shape,v.color,v.person)+'</button>').join(''):'<div class="empty">☁️👆✨</div>';$('gallery').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const v=saved[saved.length-1-i];shape=v.shape;color=v.color;person=v.person;points=v.points?.map(p=>({...p}))||points;document.querySelectorAll('.shape').forEach((e,j)=>e.classList.toggle('active',types[j]===shape));document.querySelectorAll('.swatch').forEach((e,j)=>e.classList.toggle('active',colors[j]===color));document.querySelectorAll('.person').forEach((e,j)=>e.classList.toggle('active',j===person));updateTarget();$('overlay').classList.remove('open')});$('overlay').classList.add('open')}
$('galleryButton').onclick=openGallery;$('close').onclick=()=>$('overlay').classList.remove('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.remove('open')});$('reset').onclick=reset;window.addEventListener('resize',resize);createUI();reset();resize();requestAnimationFrame(frame);
</script></body></html>
