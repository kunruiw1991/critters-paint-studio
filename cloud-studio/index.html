function requirements(){const s=current();return [{kind:'shape',ok:shape===s.shape,html:icon(s.shape,'#b4a3c8',person)},...(s.color===null?[]:[{kind:'color',ok:color===colors[s.color],html:'<div class="colorChip" style="background:'+colors[s.color]+'"></div>'}])];}

for(const parent of [$('shapes'),$('palette')])Array.from(parent.children).forEach(b=>{let original=b.onclick;b.onclick=()=>{original();missionFeedback()}});

$('magic').onclick=()=>{if(!campaign){freeMagic();return}if(won||rescue)return;const req=requirements();if(req.some(r=>!r.ok)){missionFeedback();Array.from(missionTray.children).forEach((b,i)=>b.classList.toggle('bad',!req[i].ok));Array.from($('shapes').children).forEach((b,i)=>b.classList.toggle('prompt',types[i]===current().shape));chime(190);return}beginRescue()};
const originalDrawCloud=drawCloud;

 if((s>=scale*.8&&!alive)||(rescue&&x<W*.45)){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowBlur=10;ctx.shadowColor='#fbdcff';if(item==='crown'){path([[-35,-68],[-41,-99],[-19,-85],[0,-112],[19,-85],[41,-99],[35,-68]],'#ffe095');ellipse(0,-91,5,5,'#ff8ebb')}if(item==='phones'){ctx.beginPath();ctx.arc(0,-20,83,Math.PI,0);ctx.strokeStyle='#ffd6ef';ctx.lineWidth=12;ctx.stroke();ellipse(-86,-12,16,28,'#ff9bdb');ellipse(86,-12,16,28,'#ff9bdb');ctx.fillStyle='#fff';ctx.font='22px serif';ctx.fillText('♪',-94,-5);ctx.fillText('♪',78,-5)}if(item==='wings'){ctx.globalAlpha=.8;path([[-95,30],[-160,-33],[-160,15],[-136,13],[-145,41],[-119,34],[-115,59]],'#dbfbff');path([[95,30],[160,-33],[160,15],[136,13],[145,41],[119,34],[115,59]],'#dbfbff')}ctx.restore();}
};
function removeAdventureUI(){stageEl.querySelectorAll('.adventureAction,.abilityPicker,.rescueHUD').forEach(e=>e.remove());app.querySelectorAll('.finish').forEach(e=>e.remove());}
function beginRescue(){app.classList.add('playingRescue');resize();$('hint').classList.add('hide');brief.style.display='none';rescue={mode:'play',hits:0,cycle:0,elapsed:0,acted:false,success:false,jump:0,flash:0,miss:0};lastRescueFrame=0;makeAction();chime(700);}
function makeAction(){let b=document.createElement('button');b.className='adventureAction';b.innerHTML=abilityIcons[current().ability];b.setAttribute('aria-label','Use cloud ability');b.onclick=()=>act();stageEl.append(b);let hud=document.createElement('div');hud.className='rescueHUD';stageEl.append(hud);updateRescueHUD();}
function updateRescueHUD(){let hud=stageEl.querySelector('.rescueHUD');if(hud)hud.innerHTML=Array.from({length:current().need},(_,i)=>i<rescue.hits?'⭐':'☆').join('');}
function period(){return 5.5}
function inWindow(){return !!rescue&&rescue.mode==='play'&&!rescue.acted}
function act(){if(!rescue||rescue.mode!=='play'||won)return;if(rescue.acted)return;if(!inWindow()){rescue.flash=.15;chime(220);return}rescue.elapsed=period()-.8;rescue.acted=true;rescue.success=true;rescue.hits++;rescue.jump=.8;rescue.flash=.65;chime(600+rescue.hits*80);updateRescueHUD();if(rescue.hits>=current().need){rescue.mode='win';rescue.elapsed=0;won=true;setTimeout(()=>{if(rescue?.mode==='win')finishMission()},1100)}}
const oldKeydown=e=>{if(e.code==='Space'&&rescue?.mode==='play'){e.preventDefault();act()}};document.addEventListener('keydown',oldKeydown);

const originalCanvasMove=canvas.onpointermove;canvas.onpointermove=e=>{if(!rescue)originalCanvasMove(e)};
const originalFrame=frame;
frame=function(t){if(!rescue){originalFrame(t);return}let dt=lastRescueFrame?Math.min((t-lastRescueFrame)/1000,.045):0;lastRescueFrame=t;time=t/1000;drawAdventure(dt);requestAnimationFrame(frame)};
function drawAdventure(dt){const s=current(),r=rescue;r.flash=Math.max(0,r.flash-dt);r.jump=Math.max(0,r.jump-dt);ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,['#384850','#44457b','#282353','#24173e'][s.world]);bg.addColorStop(1,['#253329','#202d4b','#59367b','#442349'][s.world]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let ground=H*.7;ctx.fillStyle=['#a8dba1','#cee9ff','#df9dff','#cd93df'][s.world];ctx.fillRect(0,ground,W,8);ctx.fillStyle='#ffffff09';for(let i=0;i<8;i++){let x=(i*W/6-time*14)%W;ellipse(x,ground+25+i%3*10,22,4,'#fff1')}
 ctx.font=Math.min(W*.1,47)+'px serif';for(let i=0;i<6;i++)ctx.fillText(['🌿','❄️','♪','✦'][s.world],(i+.3)*W/6,H*.18+(i%2)*H*.12);
 const sceneX=W*.68;if(r.mode==='pick'){ctx.font=Math.min(W*.17,85)+'px serif';ctx.fillText({jump:'🕳️',fire:'😈',light:'🌑'}[s.ability],sceneX-35,ground-12);drawCloud(W*.24,ground-65*scale,scale*.65,color,shape,person);return}
 if(r.mode==='play'){r.elapsed+=dt;if(r.elapsed>period()){if(!r.success){r.miss=0}r.elapsed=0;r.acted=false;r.success=false;r.cycle++}}
 const p=r.mode==='win'?1.1:r.elapsed/period(),obstacleX=W*(1.12-.99*p),playerX=W*.27,playerY=ground-67*scale-(s.ability==='jump'?Math.sin(Math.min(r.jump/.8,1)*Math.PI)*85*scale:0);

 if(r.flash>.2){ctx.font=50*scale+'px serif';ctx.fillText(s.ability==='fire'?'🔥':s.ability==='light'?'🌟':'✨',playerX+65*scale,ground-50*scale);ctx.fillStyle='#ffdbaa';ctx.font=23*scale+'px serif';ctx.fillText('♡  ✦  ♡',W*.55,ground-100*scale)}
