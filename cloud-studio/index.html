'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');

function svgFriend(i){const c=palettes[i%3],type=animals[i%3];let ear=type==='cat'?'<path d="m20 35-2-28 24 19M62 26 82 7l-2 28" fill="'+c+'"/>':type==='bunny'?'<ellipse cx="35" cy="22" rx="12" ry="22" fill="'+c+'"/><ellipse cx="65" cy="22" rx="12" ry="22" fill="'+c+'"/>':'<ellipse cx="18" cy="44" rx="12" ry="24" fill="#ad7456"/><ellipse cx="82" cy="44" rx="12" ry="24" fill="#ad7456"/>';return '<svg viewBox="0 0 100 100" aria-hidden="true">'+ear+'<ellipse cx="50" cy="58" rx="36" ry="31" fill="'+c+'"/><ellipse cx="34" cy="51" rx="5" ry="8" fill="#34264b"/><ellipse cx="66" cy="51" rx="5" ry="8" fill="#34264b"/><path d="M29 64Q50 88 71 64" fill="#34264b"/><path d="M36 66h28" stroke="#fff" stroke-width="5"/><circle cx="24" cy="63" r="5" fill="#ffb0cc"/><circle cx="76" cy="63" r="5" fill="#ffb0cc"/><circle cx="50" cy="91" r="7" fill="#ffe195"/></svg>'}
people.forEach((name,i)=>{let b=document.createElement('button');b.className='person'+(!i?' active':'');b.innerHTML=svgFriend(i)+'<span>'+name+'</span>';b.setAttribute('aria-label',name);b.onclick=()=>{who=i;Array.from($('family').children).forEach((b,j)=>b.classList.toggle('active',i===j));tone(500+i*120)};$('family').append(b)});
function resize(){const r=canvas.getBoundingClientRect(),oldW=W,oldH=H;W=r.width;H=r.height;S=Math.min(W/540,H/780,1.35);let d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(oldW>1){player.x*=W/oldW;player.tx*=W/oldW;player.y*=H/oldH;player.ty*=H/oldH;for(const a of [pickups,obstacles,notes,decor,particles])a.forEach(p=>{p.x*=W/oldW;p.y*=H/oldH});if(cage){cage.x*=W/oldW;cage.y*=H/oldH}}else{player.x=player.tx=W*.5;player.y=player.ty=H*.74}}
function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}

function plush(x,y,r,id,wing=true){const c=palettes[id%3],a=animals[id%3];ctx.save();ctx.translate(x,y);ctx.scale(r/60,r/60);ctx.rotate(Math.sin(t*2+id)*.04);ctx.shadowColor='#22134633';ctx.shadowBlur=16;if(wing){ctx.save();ctx.rotate(Math.sin(t*8)*.05);ellipse(-67,14,28,13,'#eee5ff');ellipse(67,14,28,13,'#eee5ff');ellipse(-57,25,26,10,'#ded4f6');ellipse(57,25,26,10,'#ded4f6');ctx.restore()}if(a==='cat'){polygon([[-39,-17],[-47,-67],[-9,-36]],c);polygon([[9,-36],[47,-67],[39,-17]],c);polygon([[-33,-32],[-40,-55],[-18,-35]],'#ecc5ed');polygon([[18,-35],[40,-55],[33,-32]],'#ecc5ed')}else if(a==='bunny'){ellipse(-24,-59,14,37,c);ellipse(24,-62,14,40,c);ellipse(-24,-62,6,25,'#f7d0eb');ellipse(24,-65,6,27,'#f7d0eb')}else{ellipse(-47,-11,17,33,'#be855e');ellipse(47,-11,17,33,'#be855e')}
let g=ctx.createLinearGradient(0,-45,0,60);g.addColorStop(0,'#fff0ff');g.addColorStop(.35,c);g.addColorStop(1,c);ellipse(0,27,32,37,c);ellipse(-23,54,15,12,c);ellipse(23,54,15,12,c);ellipse(0,-3,48,40,g);ctx.shadowBlur=0;let blink=Math.sin(t*.9+id)>.995;ellipse(-18,-8,6,blink?1.5:8,'#342644');ellipse(18,-8,6,blink?1.5:8,'#342644');if(!blink){ellipse(-20,-11,2,2.5,'#fff');ellipse(16,-11,2,2.5,'#fff')}ellipse(-31,9,9,5,'#ffb2cb77');ellipse(31,9,9,5,'#ffb2cb77');ctx.beginPath();ctx.moveTo(-27,9);ctx.quadraticCurveTo(0,43,27,9);ctx.quadraticCurveTo(0,18,-27,9);ctx.fillStyle='#32233f';ctx.fill();ctx.beginPath();ctx.moveTo(-18,12);ctx.quadraticCurveTo(0,19,18,12);ctx.strokeStyle='white';ctx.lineWidth=5;ctx.stroke();ellipse(0,28,5,5,'#ffe092');if(a==='cat'){ellipse(0,40,8,8,'#ffe0a1');ellipse(3,37,7,7,c)}else if(a==='dog'){star(0,40,10,'#ffe0a1');ellipse(0,40,5,5,'#ffc978')}else{polygon([[-3,32],[5,32],[0,39],[6,39],[-3,49],[-1,40],[-7,40]],'#ffe0a1')}ctx.restore()}
function demon(x,y,r,phase){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*3+phase)*.1);ctx.shadowColor='#b683e855';ctx.shadowBlur=20;polygon([[-r*.6,-r*.4],[-r*.7,-r*1.1],[-r*.2,-r*.65]],'#ffc9ed');polygon([[r*.2,-r*.65],[r*.7,-r*1.1],[r*.6,-r*.4]],'#ffc9ed');ellipse(0,0,r,r*.86,'#7e62ac');ctx.shadowBlur=0;ellipse(-r*.32,-r*.07,r*.12,r*.16,'#fff4bf');ellipse(r*.32,-r*.07,r*.12,r*.16,'#fff4bf');ctx.beginPath();ctx.arc(0,r*.04,r*.4,0,Math.PI);ctx.strokeStyle='#36234c';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function burst(x,y,c,n=15){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180*S,vy:(Math.random()-.5)*180*S,life:1,c,r:(3+Math.random()*5)*S})}
function tone(f,len=.13){if(!sound||!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+len);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+len+.03)}
function updateHUD(){let goal=worlds[level].goal;$('stars').innerHTML=Array.from({length:goal},(_,i)=>'<i class="pip '+(i<stars?'on':'')+'"></i>').join('');$('hearts').textContent='💗'.repeat(hearts)+'♡'.repeat(3-hearts);$('progressIcon').textContent=worlds[level].icon;$('pulse').classList.toggle('cool',magicCD>0);$('pulse').disabled=magicCD>0||mode!=='play';$('medals').textContent=rescued.length?rescued.map(i=>worlds[i].icon).join(' '):'☁️　⭐　💜'}
function start(n=unlocked){level=Math.max(0,Math.min(5,n));mode='play';stars=0;hearts=3;score=0;spawn=0;noteTimer=0;magicCD=0;invincible=2;pickups=[];obstacles=[];notes=[];particles=[];cage=null;boss=null;finishTimer=0;guideTime=4;player.x=player.tx=W*.5;player.y=player.ty=H*.73;['title','winScreen','pauseScreen'].forEach(id=>$(id).classList.add('hidden'));$('pulse').classList.remove('hidden');$('hint').classList.remove('hidden');updateHUD();tone(600);}
function magic(){if(mode!=='play'||magicCD>0)return;magicCD=4;burst(player.x,player.y,'#ffd7ef',35);obstacles.forEach(o=>{burst(o.x,o.y,'#debfff',10);if(Math.random()>.25)pickups.push({x:o.x,y:o.y,r:17*S,speed:45*S,phase:Math.random()*6})});obstacles=[];if(boss){boss.hp=Math.max(0,boss.hp-2);burst(boss.x,boss.y,'#ffe5aa',25)}tone(800,.25);updateHUD()}
function position(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function moveTo(x,y){player.tx=Math.max(40*S,Math.min(W-40*S,x));player.ty=Math.max(100*S,Math.min(H-65*S,y));guideTime=0;$('hint').classList.add('hidden')}
canvas.onpointerdown=e=>{if(mode!=='play')return;pointer=true;canvas.setPointerCapture(e.pointerId);const p=position(e);moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(mode!=='play'||!pointer)return;let p=position(e);moveTo(p.x,p.y)};canvas.onpointerup=canvas.onpointercancel=()=>pointer=false;
const keys=new Set();document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)){e.preventDefault();keys.add(e.key);if(e.key===' ')magic()}if(e.key==='Escape'){if(mode==='play')pause();else if(mode==='pause')resume()}});document.addEventListener('keyup',e=>keys.delete(e.key));
function pause(){if(mode!=='play')return;pausedFrom=mode;mode='pause';pointer=false;$('pauseScreen').classList.remove('hidden')}
function resume(){if(mode!=='pause')return;mode=pausedFrom;$('pauseScreen').classList.add('hidden')}
$('play').onclick=()=>start();$('pulse').onclick=magic;$('pause').onclick=pause;$('resume').onclick=resume;$('home').onclick=()=>{mode='title';$('pauseScreen').classList.add('hidden');$('title').classList.remove('hidden');$('pulse').classList.add('hidden');$('hint').classList.add('hidden');updateHUD()};$('next').onclick=()=>start(level===5?0:level+1);
$('sound').onclick=()=>{try{sound=!sound;if(sound){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}$('sound').textContent=sound?'🎵':'🔇'}catch(e){sound=false}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause()});
function goalReached(){if(stars<worlds[level].goal||cage||boss)return;if(level===5)boss={x:W*.5,y:H*.2,hp:8,fire:0};else cage={x:W*.5,y:-100*S,target:H*.3,age:0};}
function win(){if(mode!=='play')return;mode='rescue';finishTimer=0;burst(player.x,player.y,'#ffdea1',40);obstacles=[];if(!rescued.includes(level))rescued.push(level);unlocked=Math.max(unlocked,Math.min(5,level+1));try{localStorage.setItem('chuyu-flight-unlocked',String(unlocked));localStorage.setItem('chuyu-flight-friends',JSON.stringify(rescued))}catch(e){}[520,650,780].forEach((n,i)=>setTimeout(()=>tone(n,.2),i*130));}
function hurt(){if(invincible>0)return;hearts--;invincible=2.2;burst(player.x,player.y,'#ffb5d9',18);tone(200);if(hearts<=0){hearts=3;stars=Math.max(0,stars-2);invincible=4;obstacles=[];burst(player.x,player.y,'#c8eeff',35)}updateHUD()}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){if(mode==='rescue'){finishTimer+=dt;player.x+=(W*.5-player.x)*dt*3;player.y+=(H*.48-player.y)*dt*3;if(finishTimer>1.7){mode='win';$('award').textContent=level===5?'👑 🏆 👑':'⭐ ⭐ ⭐';$('friends').innerHTML=svgFriend(who)+svgFriend((level+1)%3);$('reward').textContent=worlds[level].icon+'　💖　'+(level===5?'🎤':'🪽');$('winScreen').classList.remove('hidden');$('pulse').classList.add('hidden');updateHUD()}return}if(mode!=='play')return;
if(keys.size){let v=300*S;moveTo(player.tx+((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*v*dt,player.ty+((keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0))*v*dt)}

spawn+=dt;noteTimer+=dt;if(noteTimer>.65){noteTimer=0;notes.push({x:player.x,y:player.y-32*S,r:10*S})}if(spawn>1.05&&!cage&&!boss){spawn=0;let lanes=[.2,.38,.5,.62,.8];let x=W*lanes[Math.floor(Math.random()*lanes.length)];pickups.push({x,y:-25*S,r:17*S,speed:(66+level*5)*S,phase:Math.random()*6});if(Math.random()<.3+level*.055){let ox=Math.max(35*S,Math.min(W-35*S,x+(Math.random()<.5?-1:1)*W*.25));obstacles.push({x:ox,y:-60*S,r:24*S,speed:(56+level*5)*S,phase:Math.random()*6,kind:Math.random()<.65?'demon':'cloud'})}}
notes.forEach(n=>n.y-=280*S*dt);notes=notes.filter(n=>n.y>-35*S&&!n.dead);pickups.forEach(p=>{p.y+=p.speed*dt;if(distance(p,player)<82*S){p.x+=(player.x-p.x)*dt*4;p.y+=(player.y-p.y)*dt*4}if(distance(p,player)<49*S){p.dead=true;stars=Math.min(worlds[level].goal,stars+1);score++;burst(p.x,p.y,'#ffe4a6',10);tone(660+(score%4)*80);if(score%4===0)hearts=Math.min(3,hearts+1);updateHUD();goalReached()}});pickups=pickups.filter(p=>!p.dead&&p.y<H+50*S);
obstacles.forEach(o=>{o.y+=o.speed*dt;o.x+=Math.sin(t*1.3+o.phase)*10*S*dt;for(const n of notes)if(!n.dead&&distance(n,o)<o.r+12*S){n.dead=true;o.dead=true;burst(o.x,o.y,'#dfb9ff',14);if(Math.random()>.45)pickups.push({x:o.x,y:o.y,r:17*S,speed:45*S,phase:o.phase});break}if(!o.dead&&distance(o,player)<o.r+23*S){o.dead=true;hurt()}});obstacles=obstacles.filter(o=>!o.dead&&o.y<H+60*S);
if(cage){cage.age+=dt;cage.y+=(cage.target-cage.y)*Math.min(1,dt*1.8);if(distance(cage,player)<80*S)win()}
if(boss){boss.x=W*.5+Math.sin(t*.65)*W*.23;boss.fire+=dt;for(const n of notes){if(!n.dead&&distance(n,boss)<70*S){n.dead=true;boss.hp--;burst(boss.x,boss.y,'#ffd69a',12)}}if(boss.hp<=0){boss=null;cage={x:W*.5,y:H*.23,target:H*.34,age:0}}else if(boss.fire>2.5){boss.fire=0;obstacles.push({x:boss.x,y:boss.y+65*S,r:23*S,speed:80*S,phase:t,kind:'demon'})}}
if(sound){musicClock+=dt;if(musicClock>.6){musicClock=0;const melody=[0,4,7,12,7,4,2,7];tone(220*2**(melody[Math.floor(t*1.6)%8]/12),.09)}}}
function background(){let w=worlds[mode==='title'?0:level],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,w.top);g.addColorStop(1,w.bottom);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.18;for(let i=0;i<14;i++){let x=((i*137.1)%W),y=((i*127.7+t*(mode==='play'?18:5)*S)%(H+160))-80;ellipse(x,y,60*S,15*S,'#fff');ellipse(x+15*S,y-12*S,32*S,23*S,'#fff')}ctx.restore();if(w.objects==='neon'||w.objects==='party'){ctx.strokeStyle='#f8baff25';ctx.lineWidth=2;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(W*.5,H*.15);ctx.lineTo(W*(i-1)/5,H);ctx.stroke()}ctx.font=26*S+'px serif';ctx.fillStyle='#ffd9ff88';for(let i=0;i<8;i++)ctx.fillText('♪',((i*177)%W),((i*97+t*18*S)%H))}if(w.objects==='moon'){ellipse(W*.82,H*.18,40*S,40*S,'#ffdeba88');ellipse(W*.85,H*.16,36*S,36*S,w.top)}if(w.objects==='snow'){for(let i=0;i<35;i++)ellipse((i*129)%W,(i*91+t*24*S)%H,2*S,2*S,'#fff8')}if(mode==='title'){plush(W*.18,H*.35,52*S,0);plush(W*.84,H*.58,48*S,2);for(let i=0;i<8;i++)star((i*131)%W,(i*167+t*8*S)%H,12*S,'#ffe9aa',t*.15)}}
function draw(){background();if(['play','pause','rescue','win'].includes(mode)){pickups.forEach(p=>{ctx.shadowColor='#ffe4a1';ctx.shadowBlur=15;star(p.x+Math.sin(t*2+p.phase)*4*S,p.y,p.r,'#ffe09a',Math.sin(t+p.phase)*.1);ctx.shadowBlur=0;ellipse(p.x-4*S,p.y-4*S,3*S,3*S,'#fff6')});obstacles.forEach(o=>{if(o.kind==='demon')demon(o.x,o.y,o.r,o.phase);else{ellipse(o.x,o.y,o.r*1.4,o.r,'#657397');ellipse(o.x-9*S,o.y-10*S,o.r*.9,o.r*.8,'#6e7a9f');ctx.font=25*S+'px serif';ctx.fillStyle='#f4cbff';ctx.fillText('ϟ',o.x-8*S,o.y+7*S)}});notes.forEach(n=>{ctx.fillStyle='#ffd1f6';ctx.shadowColor='#ffcefa';ctx.shadowBlur=12;ctx.font=29*S+'px serif';ctx.fillText('♪',n.x-8*S,n.y);ctx.shadowBlur=0});if(boss){demon(boss.x,boss.y,60*S,1);ctx.fillStyle='#3b234d';ctx.fillRect(boss.x-46*S,boss.y+63*S,92*S,8*S);ctx.fillStyle='#ffcbdc';ctx.fillRect(boss.x-46*S,boss.y+63*S,92*S*Math.max(boss.hp,0)/8,8*S)}if(cage){plush(cage.x,cage.y,43*S,(level+1)%3,false);if(mode!=='rescue'&&mode!=='win'){ctx.save();ctx.strokeStyle='#ffe5b4';ctx.lineWidth=4*S;ctx.beginPath();ctx.roundRect(cage.x-56*S,cage.y-70*S,112*S,130*S,18*S);ctx.stroke();for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(cage.x+i*27*S,cage.y-65*S);ctx.lineTo(cage.x+i*27*S,cage.y+56*S);ctx.stroke()}ctx.restore();ctx.font=26*S+'px serif';ctx.fillStyle='#fff';ctx.fillText('💖',cage.x-16*S,cage.y-82*S);ctx.font=36*S+'px serif';ctx.fillText('👆',cage.x-19*S,cage.y+103*S)}}ctx.save();if(invincible>0){ctx.strokeStyle='#d5f3ff88';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,62*S,0,Math.PI*2);ctx.stroke();if(invincible<2&&Math.sin(t*18)>0)ctx.globalAlpha=.65}plush(player.x,player.y,49*S,who);ctx.restore();if(mode==='rescue'){plush(W*.5+Math.sin(t*3)*80*S,H*.45,39*S,(level+1)%3);ctx.font=45*S+'px serif';ctx.fillText('💖',W*.5-24*S,H*.3)}}particles.forEach(p=>{ctx.globalAlpha=p.life;star(p.x,p.y,p.r,p.c,t)});ctx.globalAlpha=1;}
function frame(ms){let dt=last?Math.min((ms-last)/1000,.045):0;last=ms;if(mode!=='pause'){t+=dt;update(dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*S*dt;p.life-=dt*.8});particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}
window.addEventListener('resize',resize);resize();updateHUD();requestAnimationFrame(frame);
</script></body></html>
