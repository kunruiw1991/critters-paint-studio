<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critter Paint">
<meta name="theme-color" content="#FFFDF7">
<title>Critter Paint Studio</title>
<link rel="apple-touch-icon" href="icons/lunabat.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i></div>
<canvas id="scene"></canvas>

<header id="top">
  <div class="left">
    <button id="startBtn" class="round go" aria-label="Start">▶</button>
    <button id="pauseBtn" class="round studioOnly" aria-label="Pause">⏸</button>
    <button id="stopBtn" class="round studioOnly" aria-label="Stop">⏹</button>
    <span id="critterName" class="studioOnly"></span>
  </div>
  <div class="right">
    <button id="musicBtn" class="round" aria-label="Music">🎵</button>
    <button id="soundBtn" class="round" aria-label="Sound">🔔</button>
    <button id="doneBtn" class="studioOnly" aria-label="Done">✓</button>
  </div>
</header>

<aside id="tools" class="studioOnly">
  <div id="current" aria-label="Current tool"></div>
  <button id="fillBtn" class="tool sel" aria-label="Fill">🪣</button>
  <button id="brushBtn" class="tool" aria-label="Brush">🖌️</button>
  <button id="sizeBtn" class="tool" aria-label="Size">●</button>
  <button id="mirrorBtn" class="tool" aria-label="Mirror">🦋</button>
  <button id="undoBtn" class="tool dim" aria-label="Undo">↩️</button>
  <button id="hintBtn" class="tool" aria-label="Hint">💡</button>
  <button id="lightsBtn" class="tool" aria-label="Lights">🌙</button>
  <button id="diceBtn" class="tool dice" aria-label="Surprise me">🎲</button>
</aside>
<aside id="recent" class="studioOnly"></aside>

<div id="zoom" class="studioOnly">
  <button id="zoomIn" class="round" aria-label="Zoom in">＋</button>
  <button id="zoomOut" class="round" aria-label="Zoom out">－</button>
  <button id="resetBtn" class="round small" aria-label="Start over">🧽</button>
</div>

<nav id="picker" class="studioOnly"></nav>

<section id="drawer" class="studioOnly">
  <div id="tabs"></div>
  <div id="panel"></div>
</section>

<section id="title">
  <h1><span>Critter</span> Paint Studio</h1>
  <p class="story">Achoo! Huggy sneezed a gray cloud over Playcare.<br>Paint your friends back to color!</p>
  <div id="cards"></div>
  <button id="bigStart" aria-label="Start painting">▶</button>
</section>

<div id="bubble" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="tapHint" class="hidden">👆</div>
<div id="pauseVeil" class="hidden"><button id="resumeBtn" aria-label="Resume">▶</button></div>

<script src="js/vendor/three.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
